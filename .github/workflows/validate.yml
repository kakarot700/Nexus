name: Validate NEXUS
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
        env:
          CI: 'true'
      - name: Post browser test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f e2e.log ]; then
            printf 'Browser test output from CI (last 100 lines):\n\n```text\n' > failure.md
            tail -n 100 e2e.log >> failure.md
            printf '\n```\n' >> failure.md
            gh pr comment "$PR_NUMBER" --body-file failure.md
          fi
