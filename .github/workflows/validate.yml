name: Validate NEXUS
on:
  pull_request:
  push:
    branches: [feat/core-flow-first-slice]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log
        env:
          CI: 'true'
      - name: Annotate browser failure
        if: failure()
        run: |
          if [ -f e2e.log ]; then
            message=$(tail -n 65 e2e.log | tr '\n' ' ' | cut -c1-3500)
            echo "::error title=Browser test failure::$message"
          fi
